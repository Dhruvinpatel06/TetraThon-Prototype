[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agritech-backend"
version = "0.1.0"
description = "AgriTech advisory and decision engine backend"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0"
]
